[project]
name = "aria"
version = "1.0.0"
description = "ARIA — autonomous multi-agent engineering assistant (local-first Ollama, optional cloud providers)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
docs = ["python-docx>=1.1", "openpyxl>=3.1", "pymupdf>=1.24"]
api = ["fastapi>=0.104", "uvicorn>=0.24"]
telegram = ["python-telegram-bot>=21.0"]
browser = ["playwright>=1.40"]
mcp = ["mcp>=1.0"]
all = ["fastapi>=0.104", "uvicorn>=0.24", "python-telegram-bot>=21.0", "playwright>=1.40", "mcp>=1.0"]
test = ["pytest>=7.0"]

[project.scripts]
aria = "ultra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ultra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
